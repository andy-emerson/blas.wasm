[book]
title = "blas.wasm"
authors = ["Andy Emerson"]
language = "en"
src = "src"
description = "The BLAS for the browser: the mathematics, the rounding-order arguments behind the bit-identity promise, and the measured results, with the shipping source included live."

[rust]
edition = "2021"

# LaTeX rendered at build time; no client-side script.
[preprocessor.katex]
after = ["links"]

# Call-graph diagrams. The two JavaScript assets this preprocessor
# needs are not committed: run `mdbook-mermaid install book` once
# (the gate and the Pages workflow do), which drops mermaid.min.js and
# mermaid-init.js next to this file.
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
git-repository-url = "https://github.com/andy-emerson/blas.wasm"
edit-url-template = "https://github.com/andy-emerson/blas.wasm/edit/main/book/{path}"
site-url = "/blas.wasm/"
