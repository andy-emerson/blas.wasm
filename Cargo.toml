[package]
name = "blas-wasm"
version = "0.1.0"
edition = "2021"
publish = false

# The BLAS for the browser: SIMD streaming loops, one file per routine,
# organized by BLAS level. What is built: README.md; why: DESIGN.md;
# open work: STATUS.md. Not published to crates.io (STATUS.md, D2).

# ZERO runtime dependencies (DESIGN.md, "Zero runtime dependencies"):
# the four math entry points formerly from libm are vendored in
# src/math.rs — sqrt via the hardware instruction (IEEE requires it
# correctly rounded, so bit-identical by definition), hypot ported
# verbatim.
[dependencies]

# docs.rs (if the crate is ever published there) renders the
# mathematics and diagrams with the same header the Pages site uses.
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "rustdoc/header.html"]

[dev-dependencies]
# reference for the bit-for-bit cross-check tests of the vendored math
# (tests/math.rs) — never linked into the shipped crate
libm = { version = "0.2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
