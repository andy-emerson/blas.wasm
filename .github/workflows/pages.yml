# Publishes the crate documentation, which is the book, to GitHub Pages
# on every push to main: `cargo doc` with the KaTeX/Mermaid header, a
# root redirect to the crate page, upload, deploy. The repository's
# Pages source must be set to "GitHub Actions" once, by a human, in
# Settings → Pages. The gate is what checks the documentation (warnings
# denied); this workflow only builds and publishes it.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the documentation
        run: |
          RUSTDOCFLAGS="--html-in-header rustdoc/header.html -D warnings" cargo doc --no-deps
          echo '<meta http-equiv="refresh" content="0; url=blas_wasm/index.html">' > target/doc/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
