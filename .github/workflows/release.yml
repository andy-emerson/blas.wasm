# Tag-triggered release: builds the C-ABI module, names it blas.wasm,
# and attaches it to a GitHub release for the tag. Trigger by pushing a
# tag: git tag v0.1.0 && git push origin v0.1.0. Nothing is published
# to a registry (STATUS.md, decision D2).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build + smoke-test the module
        run: |
          cd abi
          cargo build --release --target wasm32-unknown-unknown
          node check.mjs target/wasm32-unknown-unknown/release/blas_wasm_abi.wasm
          node audit.mjs --self-test
          node audit.mjs target/wasm32-unknown-unknown/release/blas_wasm_abi.wasm --surface surface.json
          cp target/wasm32-unknown-unknown/release/blas_wasm_abi.wasm ../blas.wasm

      - name: Create release with the artifact
        uses: softprops/action-gh-release@v2
        with:
          files: blas.wasm
          generate_release_notes: true
