# On-demand performance measurement on the reference runners — the
# repo's own tuning-verdict machinery (the two-draw discipline: dispatch
# this twice, compare).
name: bench
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "rooflines | packed-race | tri-race | gemm-t-race | b0 | both"
        required: false
        default: "rooflines"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bench wasm + native
        run: |
          cd bench
          cargo build --release --target wasm32-unknown-unknown --lib
          cargo build --release --bin native

      - name: Rooflines (all levels, all types)
        if: ${{ inputs.suite == 'rooflines' || inputs.suite == 'both' }}
        run: |
          cd bench
          for lvl in 1 2 3; do
            for ty in "" "-f32" "-z" "-c"; do
              flag=""
              case "$ty" in
                "-f32") flag="--f32" ;;
                "-z")   flag="--c64" ;;
                "-c")   flag="--c32" ;;
              esac
              cargo run --release --bin native "l${lvl}-bits${ty}" > "/tmp/l${lvl}${ty}.txt"
              node "l${lvl}-roofline.mjs" \
                target/wasm32-unknown-unknown/release/blas_bench.wasm \
                "/tmp/l${lvl}${ty}.txt" $flag
            done
          done | tee ../bench-results.log

      - name: Packed-gemm race (col4 vs packed, all types, both called directly)
        if: ${{ inputs.suite == 'packed-race' || inputs.suite == 'both' }}
        run: |
          cd bench
          node packed-gemm-ab.mjs target/wasm32-unknown-unknown/release/blas_bench.wasm \
            | tee -a ../bench-results.log

      - name: Transposed trmm/trsm race (copy vs stream, all types)
        if: ${{ inputs.suite == 'tri-race' || inputs.suite == 'both' }}
        run: |
          cd bench
          node tri-t-ab.mjs target/wasm32-unknown-unknown/release/blas_bench.wasm \
            | tee -a ../bench-results.log

      - name: Transposed gemm race (copy vs transposed pack, all types)
        if: ${{ inputs.suite == 'gemm-t-race' || inputs.suite == 'both' }}
        run: |
          cd bench
          node gemm-t-ab.mjs target/wasm32-unknown-unknown/release/blas_bench.wasm \
            | tee -a ../bench-results.log

      # B0 sanity rows (STATUS.md): OpenBLAS and BLIS, single-threaded,
      # native on this runner, beside our module on the same shapes and
      # the same machine; two draws make a verdict. XNNPACK is not
      # packaged for the runner and is not built here.
      - name: B0 — install OpenBLAS and BLIS
        if: ${{ inputs.suite == 'b0' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libopenblas-dev libblis-dev
          dpkg -l | grep -E "libopenblas|libblis" | awk '{print $2, $3}'
          nproc; lscpu | grep -E "Model name|MHz" | head -3

      - name: B0 — native rows (OpenBLAS, 1 thread)
        if: ${{ inputs.suite == 'b0' }}
        run: |
          cd bench/b0
          gcc -O2 -o b0-openblas b0.c -I/usr/include/x86_64-linux-gnu/openblas-pthread -I/usr/include/x86_64-linux-gnu -I/usr/include/openblas -lopenblas
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 ./b0-openblas openblas | tee -a ../../bench-results.log

      - name: B0 — native rows (BLIS, 1 thread)
        if: ${{ inputs.suite == 'b0' }}
        run: |
          cd bench/b0
          # the Ubuntu BLIS package ships its CBLAS header under blis/; a
          # build that cannot find it is reported, not fatal, so the
          # OpenBLAS and blas.wasm rows still land
          if gcc -O2 -o b0-blis b0.c -I/usr/include/blis -I/usr/include/x86_64-linux-gnu/blis -lblis -lm -lpthread; then
            BLIS_NUM_THREADS=1 OMP_NUM_THREADS=1 ./b0-blis blis | tee -a ../../bench-results.log
          else
            echo "blis,unavailable,0,0,0 (CBLAS header or library not found)" | tee -a ../../bench-results.log
          fi

      - name: B0 — our rows (blas.wasm on Node)
        if: ${{ inputs.suite == 'b0' }}
        run: |
          cd bench
          node b0-rows.mjs target/wasm32-unknown-unknown/release/blas_bench.wasm | tee -a ../bench-results.log

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.log
