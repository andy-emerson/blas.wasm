# On-demand performance measurement on the reference runners — the
# repo's own tuning-verdict machinery (the two-draw discipline: dispatch
# this twice, compare).
name: bench
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "rooflines | packed-race | tri-race | gemm-t-race | b0 | both"
        required: false
        default: "rooflines"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bench wasm + native
        run: |
          cd bench
          cargo build --release --target wasm32-unknown-unknown --lib
          cargo build --release --bin native

      - name: Rooflines (all levels, all types)
        if: ${{ inputs.suite == 'rooflines' || inputs.suite == 'both' }}
        run: |
          cd bench
          for lvl in 1 2 3; do
            for ty in "" "-f32" "-z" "-c"; do
              flag=""
              case "$ty" in
                "-f32") flag="--f32" ;;
                "-z")   flag="--c64" ;;
                "-c")   flag="--c32" ;;
              esac
              cargo run --release --bin native "l${lvl}-bits${ty}" > "/tmp/l${lvl}${ty}.txt"
              node "l${lvl}-roofline.mjs" \
                target/wasm32-unknown-unknown/release/blas_bench.wasm \
                "/tmp/l${lvl}${ty}.txt" $flag
            done
          done | tee ../bench-results.log

      - name: Packed-gemm race (col4 vs packed, all types, both called directly)
        if: ${{ inputs.suite == 'packed-race' || inputs.suite == 'both' }}
        run: |
          cd bench
          node packed-gemm-ab.mjs target/wasm32-unknown-unknown/release/blas_bench.wasm \
            | tee -a ../bench-results.log

      - name: Transposed trmm/trsm race (copy vs stream, all types)
        if: ${{ inputs.suite == 'tri-race' || inputs.suite == 'both' }}
        run: |
          cd bench
          node tri-t-ab.mjs target/wasm32-unknown-unknown/release/blas_bench.wasm \
            | tee -a ../bench-results.log

      - name: Transposed gemm race (copy vs transposed pack, all types)
        if: ${{ inputs.suite == 'gemm-t-race' || inputs.suite == 'both' }}
        run: |
          cd bench
          node gemm-t-ab.mjs target/wasm32-unknown-unknown/release/blas_bench.wasm \
            | tee -a ../bench-results.log

      # B0 rows (STATUS.md): OpenBLAS and BLIS compiled to WebAssembly
      # (simd128, no relaxed SIMD, one thread) and run in the same Node as
      # our module, same shapes, same machine; the three are interleaved
      # twice per run and two runs make a verdict. XNNPACK is not built.
      - name: B0 — Emscripten SDK
        if: ${{ inputs.suite == 'b0' }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.15

      - name: B0 — build OpenBLAS and BLIS to wasm
        if: ${{ inputs.suite == 'b0' }}
        run: |
          emcc --version | head -1
          bench/b0/build-wasm.sh "$RUNNER_TEMP/b0wasm" | tee -a bench-results.log
          nproc; lscpu | grep -E "Model name|MHz" | head -3

      - name: B0 — rows, interleaved (blas.wasm, OpenBLAS-wasm, BLIS-wasm; two rounds)
        if: ${{ inputs.suite == 'b0' }}
        run: |
          cd bench
          for round in 1 2; do
            echo "== round $round blas.wasm" | tee -a ../bench-results.log
            node b0-rows.mjs target/wasm32-unknown-unknown/release/blas_bench.wasm | tee -a ../bench-results.log
            echo "== round $round openblas-wasm" | tee -a ../bench-results.log
            node "$RUNNER_TEMP/b0wasm/b0_openblas.js" openblas-wasm | tee -a ../bench-results.log
            echo "== round $round blis-wasm" | tee -a ../bench-results.log
            node "$RUNNER_TEMP/b0wasm/b0_blis.js" blis-wasm | tee -a ../bench-results.log
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.log
