<!-- Injected into every rustdoc page (--html-in-header). KaTeX renders
     $...$ and $$...$$ in the prose; Mermaid renders ```mermaid blocks.
     Both are pinned and loaded from jsDelivr, the way crates that
     document mathematics do it. Code blocks are left alone. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false});"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
  for (const pre of document.querySelectorAll('pre.language-mermaid')) {
    const box = document.createElement('pre');
    box.className = 'mermaid';
    box.textContent = pre.textContent;
    pre.replaceWith(box);
  }
  mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
  await mermaid.run({ querySelector: 'pre.mermaid' });
</script>
